[package]
name = "dango-widget"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dango"
path = "src/main.rs"

[lib]
name = "dango_widget"
path = "src/lib.rs"

[dependencies]
winit = "0.30"
raw-window-handle = "0.6"
window-vibrancy = "0.5"
grok-ball = { path = "../grok-ball" }
dango-lib = { path = "../dango-lib" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
futures-util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSWindow", "NSEvent", "NSPanel", "NSView", "NSVisualEffectView", "NSGraphics", "NSColor", "NSAppearance", "NSCell", "NSFontDescriptor", "NSTrackingArea", "NSWorkspace", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSFont", "NSScreen", "NSAttributedString", "NSStringDrawing", "NSPasteboard", "NSBezierPath", "NSImage", "objc2-quartz-core"] }
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSRunLoop", "NSProcessInfo", "NSString", "NSObject", "NSDictionary", "NSArray", "NSValue", "NSAttributedString", "NSURL", "NSURLRequest"] }
objc2-quartz-core = { version = "0.2", features = ["CALayer", "CATransaction", "CAShapeLayer", "CAGradientLayer", "CATransform3D", "CATextLayer", "CAMediaTiming", "CAAnimation"] }
objc2-web-kit = { version = "0.2", default-features = false, features = ["objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKNavigation", "block2"] }
core-graphics = "0.24"
core-foundation = "0.10"

[dev-dependencies]
tower = "0.5"
